<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Rift Fighters</title>
<link rel="icon" href="/icon.png">
<style>
:root { --bg:#070b1e; --panel:#0e1636; --line:#1d2a5c; --or:#fda048; --cy:#78d7ff; --tx:#eef3ff; --mu:#8f9bbf; --rd:#f05a64; --gn:#6ee696; }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; background:var(--bg); color:var(--tx); font-family:"Segoe UI",system-ui,sans-serif; overflow:hidden; user-select:none; }
body { background: radial-gradient(1200px 500px at 70% -10%, #1a2a6a55, transparent), radial-gradient(800px 400px at 0% 110%, #fda04822, transparent), var(--bg); }
.wrap { display:grid; grid-template-rows: auto 1fr auto; height:100%; padding:22px 30px 18px; gap:14px; }
header { display:flex; align-items:center; justify-content:space-between; }
header img { height:96px; filter: drop-shadow(0 4px 18px #78d7ff44); }
.ver { text-align:right; color:var(--mu); font-size:13px; line-height:1.6; }
.ver b { color:var(--cy); font-size:15px; }
.main { display:grid; grid-template-columns: 1fr 240px; gap:18px; min-height:0; }
.card { background:linear-gradient(180deg,#111b42,#0b1230); border:1px solid var(--line); border-radius:14px; padding:20px 22px; position:relative; overflow:hidden; }
.card:before { content:""; position:absolute; left:0; top:0; right:0; height:3px; background:linear-gradient(90deg,var(--or),var(--cy)); }
.state { font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--or); font-weight:700; }
.msg { font-size:19px; margin:10px 0 18px; min-height:52px; line-height:1.35; }
.bar { height:12px; background:#060a1c; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
.bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--or),#ffd27a); transition:width .2s; }
.bar.indet i { width:35%; animation: slide 1.1s infinite ease-in-out; }
@keyframes slide { 0%{margin-left:-35%} 100%{margin-left:100%} }
.small { color:var(--mu); font-size:13px; margin-top:12px; }
.side { display:flex; flex-direction:column; gap:10px; }
button { font:inherit; border:0; border-radius:12px; padding:13px 16px; color:var(--tx); background:#16224e; border:1px solid var(--line); cursor:pointer; text-align:left; font-weight:600; transition: transform .08s, background .15s; }
button:hover:not(:disabled) { background:#1e2f6a; transform: translateY(-1px); }
button:disabled { opacity:.4; cursor:default; }
button.play { background:linear-gradient(180deg,#ffb35c,#f08a2a); color:#1a0f02; font-size:24px; font-weight:800; letter-spacing:.06em; text-align:center; padding:20px; border:0; box-shadow:0 8px 26px #fda04855; }
button.play:hover:not(:disabled) { background:linear-gradient(180deg,#ffc276,#f59a3e); }
button.upd { background:linear-gradient(180deg,#2b6fd6,#1d4fa8); border:0; text-align:center; font-size:17px; }
.prof { margin-top:16px; border-top:1px solid var(--line); padding-top:14px; }
.prof label { color:var(--mu); font-size:13px; display:block; margin-bottom:6px; }
.prof .row { display:flex; gap:8px; }
.prof input[type=text], .prof input:not([type]) { flex:1; font:inherit; background:#060a1c; border:1px solid var(--line); color:var(--tx); border-radius:10px; padding:9px 12px; }
.prof .row button { padding:9px 14px; }
.prof .chk { margin-top:10px; display:flex; gap:8px; align-items:center; color:var(--tx); }
footer { display:flex; justify-content:space-between; color:var(--mu); font-size:12px; }
.ok { color:var(--gn) } .bad { color:var(--rd) }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="/icon.png" alt="Rift Fighters">
    <div class="ver">Tu version: <b id="lv">-</b><br>Ultima version: <b id="rv">-</b><br><span id="lc"></span></div>
  </header>
  <div class="main">
    <div class="card">
      <div class="state" id="state">Iniciando</div>
      <div class="msg" id="msg">Preparando el lanzador...</div>
      <div class="bar" id="bar"><i id="fill"></i></div>
      <div class="small" id="small"></div>
      <div class="prof">
        <label>Tu apodo en la pagina de estadisticas</label>
        <div class="row"><input id="nick" maxlength="20" placeholder="Escribe un apodo"><button id="bNick">Guardar</button></div>
        <label class="chk"><input type="checkbox" id="share" checked> Compartir mis partidas online (personajes y resultado)</label>
        <div class="small" id="srv"></div>
      </div>
    </div>
    <div class="side">
      <button class="play" id="bPlay">JUGAR</button>
      <button class="upd" id="bUpd" style="display:none">ACTUALIZAR</button>
      <button id="bCheck">Buscar actualizaciones</button>
      <button id="bVerify">Verificar archivos</button>
      <button id="bDiscord">Discord</button>
      <button id="bWeb">Pagina web</button>
    </div>
  </div>
  <footer><span>Rift Fighters - juego gratuito hecho por fans</span><span id="lver"></span></footer>
</div>
<script>
const TOKEN = "{{TOKEN}}";
const $ = id => document.getElementById(id);
const post = p => fetch('/api/' + p, {method:'POST', headers:{'X-RF-Token': TOKEN}});
const NAMES = {listo:'Listo', revisando:'Buscando', verificando:'Verificando', descargando:'Descargando', instalando:'Instalando',
  actualizado:'Al dia', pendiente:'Actualizacion disponible', instalar:'Instalacion', error:'Error', sinconexion:'Sin conexion',
  sinconfig:'Sin configurar', jugando:'Abriendo'};
function fmt(n){ if(n>=1073741824) return (n/1073741824).toFixed(1)+' GB'; if(n>=1048576) return (n/1048576).toFixed(1)+' MB'; return Math.round(n/1024)+' KB'; }
var tick = async function(){
  try {
    const r = await fetch('/api/estado'); const d = await r.json(); const s = d.status;
    $('state').textContent = NAMES[s.phase] || s.phase;
    $('state').className = 'state ' + (s.phase==='error'?'bad':(s.phase==='actualizado'?'ok':''));
    $('msg').textContent = s.message || '';
    $('lv').textContent = s.localVersion; $('rv').textContent = s.remoteVersion || '-';
    $('lc').textContent = s.lastChecked ? 'Revisado a las ' + s.lastChecked : '';
    $('lver').textContent = 'Lanzador ' + d.launcher;
    const bar = $('bar'), fill = $('fill');
    if (s.busy && s.progress < 0) { bar.className='bar indet'; fill.style.width=''; }
    else { bar.className='bar'; fill.style.width = (s.progress>=0 ? Math.round(s.progress*100) : (s.phase==='actualizado'?100:0)) + '%'; }
    const pending = !s.busy && s.needFiles > 0 && (s.phase==='pendiente' || s.phase==='instalar' || s.phase==='error');
    $('bUpd').style.display = pending ? '' : 'none';
    $('bUpd').textContent = s.installed ? 'ACTUALIZAR (' + fmt(s.needBytes) + ')' : 'INSTALAR (' + fmt(s.needBytes) + ')';
    $('bPlay').disabled = s.busy || !s.canPlay;
    $('bCheck').disabled = s.busy || !s.configured; $('bVerify').disabled = s.busy || !s.configured;
    $('bDiscord').style.display = d.discord ? '' : 'none'; $('bWeb').style.display = d.web ? '' : 'none';
    $('small').textContent = s.needFiles > 0 && !s.busy ? s.needFiles + ' archivos por descargar' : '';
  } catch(e) { $('msg').textContent = 'El lanzador se cerro.'; }
};
$('bPlay').onclick = () => post('jugar');
$('bUpd').onclick = () => post('actualizar');
$('bCheck').onclick = () => post('revisar');
$('bVerify').onclick = () => post('verificar');
$('bDiscord').onclick = () => post('discord');
$('bWeb').onclick = () => post('web');
let nickInit = false;
async function saveNick(){ await fetch('/api/apodo', {method:'POST', headers:{'X-RF-Token': TOKEN, 'Content-Type':'application/json'},
  body: JSON.stringify({nick: $('nick').value, share: $('share').checked})}); $('bNick').textContent = 'Guardado'; setTimeout(()=>$('bNick').textContent='Guardar', 1500); }
$('bNick').onclick = saveNick; $('share').onchange = saveNick;
const oldTick = tick;
tick = async function(){ await oldTick(); try { const d = await (await fetch('/api/estado')).json();
  if(!nickInit){ $('nick').value = d.nick || ''; $('share').checked = d.share; nickInit = true; }
  $('srv').textContent = d.server ? 'Conectado al servidor de estadisticas.' : 'El servidor de estadisticas todavia no esta configurado.'; } catch(e){} };
setInterval(tick, 400); tick();
</script>
</body>
</html>
